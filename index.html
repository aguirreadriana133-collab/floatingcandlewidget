<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Candle Widget</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
</head>
<body>
<div class="widget-container">
  <div class="border-animation"></div>
  <div class="candle-area">
    <img src="candle.png" class="candle">
    <img src="ghost.png" class="ghost">
  </div>
  <div class="song-info">
    <div id="track">Song Title</div>
    <div id="artist">Artist Name</div>
  </div>
</div>
<script>
function updateSong(title, artist) {
  document.getElementById('track').textContent = title;
  document.getElementById('artist').textContent = artist;
}
// Demo update
setTimeout(() => { updateSong('Moonlit Mushrooms', 'Ghost Grove'); }, 2000);
</script>
</body>
</html>
